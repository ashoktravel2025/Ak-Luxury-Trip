<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ashok Travel — Luxe Journeys</title>
  <meta name="description" content="Premium travel agency — curated luxury tours" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#04121b; --card:#071827; --muted:#98a8b9; --accent1:#7c3aed; --accent2:#06b6d4; --glass:rgba(255,255,255,0.04);
      --maxw:1200px; --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;color:#eaf2fb;background:linear-gradient(180deg,#021018 0%, #041827 100%)}
    .wrap{max-width:var(--maxw);margin:28px auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:60px;height:60px;border-radius:14px;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:white}
nav{display:flex;gap:18px;align-items:center}
nav a{color:rgba(255,255,255,0.8);text-decoration:none;padding:8px 10px;border-radius:10px}
nav a:hover{background:var(--glass)}
.btn-primary{background:linear-gradient(90deg,var(--accent1),var(--accent2));padding:10px 16px;border-radius:12px;color:#fff;text-decoration:none}

/* Hero */
.hero-wrap{display:grid;grid-template-columns:1fr 480px;gap:28px;margin-top:18px;align-items:center}
.hero-cta{padding:40px;border-radius:18px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));backdrop-filter: blur(8px);box-shadow:0 8px 40px rgba(2,6,23,0.6)}
.hero-cta h1{font-size:44px;line-height:1.02;margin:0 0 12px 0}
.hero-cta p{color:var(--muted);margin:0 0 20px}
.search{display:flex;gap:12px}
.search input{flex:1;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:#e8f5ff}
.search button{padding:12px 16px;border-radius:12px;border:0;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:white}

.visual{position:relative}
.visual .hero-img{width:100%;height:420px;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(2,6,23,0.7);background-size:cover;background-position:center;display:flex;align-items:flex-end}
.visual .overlay-card{position:absolute;left:28px;bottom:28px;background:linear-gradient(180deg, rgba(4,10,18,0.85), rgba(4,10,18,0.7));padding:18px;border-radius:14px;width:86%;backdrop-filter: blur(6px)}
.visual .overlay-card h3{margin:0;color:#fff}
.stars{color:#f6c84c;margin-top:6px}

/* packages */
.section{margin-top:40px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:20px;border-radius:14px;box-shadow:0 10px 30px rgba(2,6,23,0.5)}
.card h4{margin:0 0 8px}
.card p{color:var(--muted);margin:0}
.price{margin-top:12px;font-weight:700}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.gallery .g{height:140px;border-radius:12px;background-size:cover;background-position:center}

/* contact */
.contact{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-top:30px}
