<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ashok Travel – Vehicles & Equipment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
    }
    h2 {
      text-align: center;
      margin-top: 40px;
      font-size: 32px;
    }
    .gallery-section {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      text-align: center;
      transition: 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .placeholder {
      width: 100%;
      height: 150px;
      background: #e0e0e0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #555;
    }
    .title {
      margin-top: 10px;
      font-weight: bold;
      font-size: 20px;
    }
  </style>
</head>
<body>  <h2>Our Premium Vehicles</h2>
  <div class="gallery-section">
    <div class="grid"><div class="card">
    <div class="placeholder">Image</div>
    <div class="title">Ertiga (4 Units)</div>
  </div>

  <div class="card">
    <div class="placeholder">Image</div>
    <div class="title">Sedan (2 Units)</div>
  </div>

  <div class="card">
    <div class="placeholder">Image</div>
    <div class="title">Travel Tempo (1 Unit)</div>
  </div>

  <div class="card">
    <div class="placeholder">Image</div>
    <div class="title">Bolero Camper 4×4 Off-Road</div>
  </div>

  <div class="card">
    <div class="placeholder">Image</div>
    <div class="title">Innova Crysta (1 Unit)</div>
  </div>

</div>

  </div>  <h2>Professional Equipment</h2>
  <div class="gallery-section">
    <div class="grid"><div class="card">
    <div class="placeholder">Image</div>
    <div class="title">Videographer Camera</div>
  </div>

  <div class="card">
    <div class="placeholder">Image</div>
    <div class="title">Drone Camera</div>
  </div>

  <div class="card">
    <div class="placeholder">Image</div>
    <div class="title">Photographer Camera</div>
  </div>

</div>

  </div></body>
</html>
